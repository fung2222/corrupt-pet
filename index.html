<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05010f">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="腐核寵 CORRUPT.PET — raise a cyber pet that gets worse. Cyber Hub MVP.">
<title>腐核寵 CORRUPT.PET</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305010f'/%3E%3Cpath d='M8 22 L16 6 L24 22 Z' fill='%231a1e28' stroke='%23ff2bd6' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%2300e5ff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./css/game.css?v=0.1.3">
</head>
<body>
<div id="app">
  <header class="topbar">
    <button type="button" class="ibar" id="btn-home" aria-label="返回主頁">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5L12 4l8 7.5V20a1 1 0 0 1-1 1h-5.5v-6h-3v6H5a1 1 0 0 1-1-1v-8.5z"/></svg>
    </button>
    <div class="brand">
      <span class="brand-zh">腐核寵</span>
      <span class="brand-en">CORRUPT.PET</span>
    </div>
    <div class="top-actions">
      <button type="button" class="ibar" id="btn-howto" aria-label="玩法說明">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h6.5A2.5 2.5 0 0 1 14 7v13.5H7A2 2 0 0 1 5 18.5v-14zM19 4.5h-6.5A2.5 2.5 0 0 0 10 7v13.5h7A2 2 0 0 0 19 18.5v-14z"/><path d="M12 7.2v13"/></svg>
      </button>
      <button type="button" class="ibar" id="btn-gear" aria-label="設定">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.1"/><path d="M12 3.4l.7 2.1a6.8 6.8 0 0 1 1.9.8l2.1-.8 1.4 2.4-1.6 1.5c.2.6.3 1.2.3 1.8s-.1 1.2-.3 1.8l1.6 1.5-1.4 2.4-2.1-.8a6.8 6.8 0 0 1-1.9.8l-.7 2.1h-2.8l-.7-2.1a6.8 6.8 0 0 1-1.9-.8l-2.1.8L3.9 15l1.6-1.5A6.8 6.8 0 0 1 5.2 12c0-.6.1-1.2.3-1.8L3.9 8.7 5.3 6.3l2.1.8a6.8 6.8 0 0 1 1.9-.8l.7-2.1H12z"/></svg>
      </button>
    </div>
  </header>

  <main class="stage">
    <canvas id="pet" width="360" height="360" aria-label="pet silhouette"></canvas>
    <div id="form-tag" class="form-tag">CHIP_EGG</div>
    <p id="status" class="status" aria-live="polite">罪晶在跳。輕觸孵化。</p>
  </main>

  <section id="meters" class="meters hidden" aria-label="care meters">
    <div class="meter" data-key="hunger"><span class="m-label">飢餓</span><div class="m-track"><i></i></div><span class="m-val">0</span></div>
    <div class="meter" data-key="stability"><span class="m-label">穩定</span><div class="m-track"><i></i></div><span class="m-val">0</span></div>
    <div class="meter" data-key="heat"><span class="m-label">熱</span><div class="m-track"><i></i></div><span class="m-val">0</span></div>
    <div class="meter" data-key="loyalty"><span class="m-label">忠誠</span><div class="m-track"><i></i></div><span class="m-val">0</span></div>
    <div class="meter" data-key="glitch"><span class="m-label">毛刺</span><div class="m-track"><i></i></div><span class="m-val">0</span></div>
  </section>

  <nav id="actions" class="actions hidden" aria-label="care actions">
    <button type="button" data-act="feed">餵食<span>FEED</span></button>
    <button type="button" data-act="neglect">忽視<span>NEGLECT</span></button>
    <button type="button" data-act="inject">注入<span>INJECT</span></button>
    <button type="button" data-act="jackin">插線<span>JACK-IN</span></button>
    <button type="button" data-act="punish">懲罰<span>PUNISH</span></button>
  </nav>

  <footer class="foot">
    <span id="hint">MVP · 短局照料 · 長期腐化</span>
    <button type="button" id="btn-reset" class="linkish">重孵 RESET</button>
  </footer>
</div>

<div id="jackin-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="jackin-title">
  <div class="modal-card">
    <h2 id="jackin-title">插線 JACK-IN</h2>
    <p id="jackin-copy">在亮區放開。</p>
    <div class="jack-track" id="jack-track">
      <div class="jack-zone" id="jack-zone"></div>
      <div class="jack-needle" id="jack-needle"></div>
    </div>
    <button type="button" id="jack-tap" class="neon-btn">鎖定 LOCK</button>
    <button type="button" id="jack-cancel" class="ghost-btn">中止</button>
  </div>
</div>

<div id="melt-modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-card danger">
    <h2 id="melt-title">熔毀 MELT</h2>
    <p id="melt-copy">焦黑晶渣。還要再養一隻更壞的嗎？</p>
    <button type="button" id="btn-rehatch" class="neon-btn">重孵 RE-HATCH</button>
  </div>
</div>

<div id="sheet-howto" class="sheet hidden" role="dialog" aria-modal="true">
  <div class="sheet-card">
    <h2 id="howto-title">玩法</h2>
    <p id="howto-copy"></p>
    <button type="button" id="howto-close" class="neon-btn">知道啦</button>
  </div>
</div>
<div id="sheet-gear" class="sheet hidden" role="dialog" aria-modal="true">
  <div class="sheet-card">
    <h2>設定</h2>
    <div class="top-actions">
      <button type="button" id="btn-lang" class="chip" aria-label="Language">中 / EN</button>
      <button type="button" id="btn-mute" class="chip" aria-pressed="false">♪</button>
    </div>
    <button type="button" id="gear-close" class="ghost-btn">關閉</button>
  </div>
</div>

<script type="module" src="./js/main.js?v=0.1.4"></script>
</body>
</html>
